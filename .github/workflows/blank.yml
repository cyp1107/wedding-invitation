<script>
/* ======================================================
 * ✏️  여기만 수정하면 청첩장이 완성됩니다
 * ====================================================== */

/* ── 배포 URL ── */
const SITE_URL = 'https://your-site.vercel.app'; /* 교체 필요 : Vercel 배포 후 실제 주소로 교체 */

/* ── OG 이미지 ── */
const OG_IMAGE = SITE_URL + '/hero.jpg';

/* ── Hero 미디어 ── */
const HERO_TYPE = 'photo';

/* ── BGM 파일명 ── */
const BGM_FILE = 'bgm.mp3';

/* ── 갤러리 사진 수 ── */
const GALLERY_COUNT = 10;

/* ── 신랑·신부 ── */
const GROOM_NAME    = '원정빈';
const BRIDE_NAME    = '박채영';
const GROOM_PARENTS = '박종호·김현숙';
const BRIDE_PARENTS = '박종호·김현숙';
const GROOM_ORDER   = '장남';
const BRIDE_ORDER   = '차녀';

/* ── 예식 일시 ── */
const WEDDING_DATE = '2027-05-09';
const WEDDING_TIME = '13:00';

/* ── 예식장 ── */
const VENUE_NAME = '고려대학교 웨드유웨딩홀';
const VENUE_HALL = '웨드유웨딩홀';
const VENUE_ADDR = '서울 성북구 종암로 13';

/* ── 외부 서비스 ── */
const GAS_URL   = ''; /* 교체 필요(2탄) */
const KAKAO_KEY = ''; /* 교체 필요(2탄) */
const DRIVE_URL = ''; /* 교체 필요(2탄) */

/* ====================================================== */

// OG 태그 동적 갱신
document.querySelector('meta[property="og:url"]').content         = SITE_URL;
document.querySelector('meta[property="og:image"]').content       = OG_IMAGE;
document.querySelector('meta[property="og:title"]').content       = `${GROOM_NAME} ♥ ${BRIDE_NAME}`;
document.querySelector('meta[property="og:description"]').content = `${WEDDING_DATE} · ${VENUE_NAME}`;

// 월별 테마
const _month = new Date(WEDDING_DATE).getMonth() + 1;
document.documentElement.setAttribute('data-theme', `month-${_month}`);

// ── 날짜 유틸 ──
const DOW_KR  = ['일','월','화','수','목','금','토'];
const DOW_EN  = ['SUN','MON','TUE','WED','THU','FRI','SAT'];

function getWeddingDate() {
  const [y,m,d] = WEDDING_DATE.split('-').map(Number);
  const [hh,mm] = WEDDING_TIME.split(':').map(Number);
  return new Date(y, m-1, d, hh, mm, 0);
}

function formatKr(dt) {
  const h  = dt.getHours();
  const mi = String(dt.getMinutes()).padStart(2,'0');
  const ap = h < 12 ? '오전' : (h === 12 ? '낮' : '오후');
  const h12 = h === 0 ? 12 : h > 12 ? h - 12 : h;
  return `${dt.getFullYear()}년 ${dt.getMonth()+1}월 ${dt.getDate()}일 ${DOW_KR[dt.getDay()]}요일 ${ap} ${h12}시 ${mi}분`;
}

function formatEn(dt) {
  const y  = dt.getFullYear();
  const m  = String(dt.getMonth()+1).padStart(2,'0');
  const d  = String(dt.getDate()).padStart(2,'0');
  return `${y} · ${m} · ${d} · ${DOW_EN[dt.getDay()]} · ${WEDDING_TIME}`;
}

// ── Toast ──
function toast(msg, dur=2500) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.classList.remove('show'), dur);
}

// ── Hero 초기화 ──
(function initHero() {
  document.getElementById('groomSpan').textContent = GROOM_NAME;
  document.getElementById('brideSpan').textContent = BRIDE_NAME;

  const wd = getWeddingDate();
  document.getElementById('heroDateKr').textContent = formatKr(wd);
  document.getElementById('heroDateEn').textContent = formatEn(wd);
  document.getElementById('heroVenue').textContent  = `${VENUE_NAME} · ${VENUE_HALL}`;

  // 패럴랙스
  const media = document.querySelector('.hero-media');
  if(media) {
    window.addEventListener('scroll', () => {
      media.style.transform = `translateY(${window.scrollY * 0.28}px)`;
    }, { passive: true });
  }

  // 순차 fadeIn
  setTimeout(() => document.getElementById('heroLead').classList.add('in'),  300);
  setTimeout(() => document.getElementById('heroNames').classList.add('in'),  600);
  setTimeout(() => document.getElementById('heroBox').classList.add('in'),    900);
  setTimeout(() => document.getElementById('heroVenue').classList.add('in'), 1200);
})();

// ── 꽃잎 생성 ──
(function createPetals() {
  const wrap = document.getElementById('petalWrap');
  for(let i = 0; i < 18; i++) {
    const el = document.createElement('div');
    el.className = 'petal';
    const sz = 7 + Math.random() * 10;
    el.style.cssText = [
      `left:${Math.random()*100}%`,
      `width:${sz}px`,
      `height:${sz}px`,
      `animation-duration:${4 + Math.random()*7}s`,
      `animation-delay:${Math.random()*7}s`,
      `border-radius:${Math.random()>0.5?'50% 0 50% 0':'50%'}`,
      `opacity:${0.45 + Math.random()*0.45}`
    ].join(';');
    wrap.appendChild(el);
  }
})();

// ── IntersectionObserver ──
(function initFadeUp() {
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(e => {
      if(e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }
    });
  }, { threshold: 0.1 });
  document.querySelectorAll('.fade-up').forEach(el => obs.observe(el));
})();

// ── 위치 정보 렌더링 ──
(function initLocation() {
  document.getElementById('venueNameDisp').textContent = `${VENUE_NAME} · ${VENUE_HALL}`;
  document.getElementById('venueAddrDisp').textContent  = VENUE_ADDR;
  document.getElementById('carInfo').innerHTML =
    `내비게이션 검색어: <b>${VENUE_NAME}</b> 또는 <b>${VENUE_ADDR}</b><br>
     <!-- 교체 필요 : 주차 안내 (무료 시간·요금) -->
     주차 안내: 2시간 무료 주차<br>
     <!-- 교체 필요 : 유의사항 -->
     유의사항: 대중교통 이용을 권장드립니다`;
})();

// ── 지도 reveal ──
function revealMap() {
  document.getElementById('mapOverlay').style.display = 'none';
  /* 교체 필요(2탄) : 아래 src를 실제 구글 맵 임베드 URL로 교체하세요 */
  document.getElementById('mapFrame').src =
    `https://maps.google.com/maps?q=${encodeURIComponent(VENUE_ADDR)}&output=embed&hl=ko`;
  toast('지도를 불러오는 중입니다 🗺️');
}

function openMapApp(type) {
  const enc = encodeURIComponent(VENUE_ADDR);
  if(type === 'kakao') { window.open(`https://map.kakao.com/link/search/${enc}`, '_blank'); }
  else if(type === 'naver') { window.open(`https://map.naver.com/p/search/${enc}`, '_blank'); }
  else if(type === 'tmap') {
    const isMob = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(isMob) window.location.href = `tmap://search?name=${enc}`;
    else alert('티맵은 모바일에서만 이용 가능합니다.');
  }
}

// ── 달력 ──
(function initCalendar() {
  const wd    = getWeddingDate();
  const y     = wd.getFullYear();
  const m     = wd.getMonth();
  const wDay  = wd.getDate();
  const first = new Date(y, m, 1).getDay();
  const last  = new Date(y, m+1, 0).getDate();
  const prevLast = new Date(y, m, 0).getDate();

  let html = '<tr>';
  let col  = 0;

  for(let i = first - 1; i >= 0; i--) {
    const cls = col===0 ? 'grey sun' : (col===6 ? 'grey sat' : 'grey');
    html += `<td class="${cls}">${prevLast-i}</td>`;
    col++;
  }
  for(let d = 1; d <= last; d++) {
    if(col === 7) { html += '</tr><tr>'; col = 0; }
    let cls = col===0 ? 'sun' : col===6 ? 'sat' : '';
    if(d === wDay) {
      cls += (cls?' ':'') + 'wedding-day';
      html += `<td class="${cls}"><span>${d}</span></td>`;
    } else {
      html += `<td class="${cls}">${d}</td>`;
    }
    col++;
  }
  let nd = 1;
  while(col < 7) {
    html += `<td class="${col===6?'grey sat':'grey'}">${nd++}</td>`;
    col++;
  }
  html += '</tr>';
  document.getElementById('calBody').innerHTML = html;

  // D-Day
  const nowKST   = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
  const todayKST = new Date(nowKST.getFullYear(), nowKST.getMonth(), nowKST.getDate());
  const wdMid    = new Date(y, m, wDay);
  const diff     = Math.round((wdMid - todayKST) / 86400000);
  let msg;
  if(diff > 0)      msg = `결혼식까지 ${diff}일 남았습니다 💜`;
  else if(diff===0) msg = '결혼식이 오늘입니다 🎊';
  else              msg = '축복 속에 결혼식을 무사히 마쳤습니다 🙏';
  document.getElementById('ddayText').textContent = msg;
})();

// ── 캘린더 추가 ──
function addToCalendar() {
  const [y,mo,d] = WEDDING_DATE.split('-').map(Number);
  const [h,mi]   = WEDDING_TIME.split(':').map(Number);
  const start    = new Date(y, mo-1, d, h, mi);
  const end      = new Date(y, mo-1, d, h+2, mi);

  function pad(n) { return String(n).padStart(2,'0'); }
  function toUTC(dt) {
    const u = new Date(dt.getTime() - 9*3600000);
    return `${u.getFullYear()}${pad(u.getMonth()+1)}${pad(u.getDate())}T${pad(u.getHours())}${pad(u.getMinutes())}00Z`;
  }
  function toGCal(dt) {
    return `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`;
  }

  const isApple = /iPhone|iPad|iPod|Macintosh/i.test(navigator.userAgent);
  if(isApple) {
    const ics = [
      'BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Wedding//KR',
      'BEGIN:VEVENT',
      `DTSTART:${toUTC(start)}`,
      `DTEND:${toUTC(end)}`,
      `SUMMARY:${GROOM_NAME} ♥ ${BRIDE_NAME} 결혼식`,
      `LOCATION:${VENUE_NAME} ${VENUE_ADDR}`,
      `DESCRIPTION:${GROOM_NAME}과 ${BRIDE_NAME}의 결혼식에 초대합니다.`,
      'END:VEVENT','END:VCALENDAR'
    ].join('\r\n');
    const blob = new Blob([ics], {type:'text/calendar'});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'wedding.ics'; a.click();
    URL.revokeObjectURL(url);
  } else {
    const url = `https://calendar.google.com/calendar/render?action=TEMPLATE` +
      `&text=${encodeURIComponent(GROOM_NAME+' ♥ '+BRIDE_NAME+' 결혼식')}` +
      `&dates=${toGCal(start)}/${toGCal(end)}` +
      `&location=${encodeURIComponent(VENUE_NAME+' '+VENUE_ADDR)}` +
      `&details=${encodeURIComponent(GROOM_NAME+'과 '+BRIDE_NAME+'의 결혼식에 초대합니다.')}`;
    window.open(url, '_blank');
  }
}

// ── RSVP ──
let _rsvpScrollY = 0;
function openRsvp() {
  _rsvpScrollY = window.scrollY;
  document.body.style.position = 'fixed';
  document.body.style.top      = `-${_rsvpScrollY}px`;
  document.body.style.width    = '100%';
  document.getElementById('rsvpModal').classList.add('open');
}
function closeRsvp() {
  document.getElementById('rsvpModal').classList.remove('open');
  document.body.style.position = '';
  document.body.style.top      = '';
  document.body.style.width    = '';
  window.scrollTo(0, _rsvpScrollY);
}
function toggleBus(radio) {
  document.getElementById('busGroup').classList.toggle('show', radio.value === '참석');
}
function submitRsvp() {
  if(!GAS_URL) { toast('현재 참석 전달 기능을 준비 중입니다 🙏'); return; }
  const side   = document.querySelector('input[name="side"]:checked');
  const attend = document.querySelector('input[name="attend"]:checked');
  const name   = document.getElementById('rsvpName').value.trim();
  if(!side || !name || !attend) { toast('모든 항목을 입력해주세요'); return; }

  const lsKey = 'rsvp_' + WEDDING_DATE;
  if(localStorage.getItem(lsKey)) {
    if(!confirm('이미 참석 의사를 전달하셨습니다. 수정하시겠습니까?')) return;
  }
  const busEl = document.querySelector('input[name="bus"]:checked');
  const fd    = new FormData();
  fd.append('side',   side.value);
  fd.append('name',   name);
  fd.append('count',  document.getElementById('rsvpCount').value);
  fd.append('child',  document.getElementById('rsvpChild').value);
  fd.append('attend', attend.value);
  fd.append('bus',    busEl ? busEl.value : '해당없음');

  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), 15000);
  fetch(GAS_URL, { method:'POST', mode:'no-cors', body: fd, signal: ctrl.signal })
    .then(() => {
      clearTimeout(tid);
      localStorage.setItem(lsKey, '1');
      closeRsvp();
      toast('참석 의사를 전달했습니다 💌');
    })
    .catch(() => {
      clearTimeout(tid);
      alert('전송 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.');
    });
}

// ── 갤러리 ──
(function initGallery() {
  const grid = document.getElementById('galleryGrid');
  for(let i = 1; i <= GALLERY_COUNT; i++) {
    const item = document.createElement('div');
    item.className = 'gal-item';
    const img = document.createElement('img');
    img.src     = `./gallery/${i}.jpg`;
    img.alt     = `갤러리 ${i}`;
    img.loading = 'lazy';
    img.onerror = function() {
      this.onerror = null;
      this.style.display = 'none';
      const ph = document.createElement('div');
      ph.className = 'gal-placeholder';
      ph.textContent = `Photo ${i}`;
      item.appendChild(ph);
    };
    const idx = i - 1;
    img.onclick = () => openGalModal(idx);
    item.appendChild(img);
    grid.appendChild(item);
  }
})();

let _galIdx = 0;
function openGalModal(idx) {
  _galIdx = idx;
  renderGalModal();
  document.getElementById('galModal').classList.add('open');
}
function renderGalModal() {
  document.getElementById('gmImg').src       = `./gallery/${_galIdx+1}.jpg`;
  document.getElementById('gmCounter').textContent = `${_galIdx+1} / ${GALLERY_COUNT}`;
}
function closeGalModal() { document.getElementById('galModal').classList.remove('open'); }
function navGal(dir) {
  _galIdx = (_galIdx + dir + GALLERY_COUNT) % GALLERY_COUNT;
  renderGalModal();
}
// 갤러리 스와이프
(function initGalSwipe() {
  const modal = document.getElementById('galModal');
  let sx = 0, sy = 0;
  modal.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, {passive:true});
  modal.addEventListener('touchend',   e => {
    const dx = e.changedTouches[0].clientX - sx;
    const dy = e.changedTouches[0].clientY - sy;
    if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) navGal(dx > 0 ? -1 : 1);
    else if(Math.abs(dy) > 100 && Math.abs(dy) > Math.abs(dx)) closeGalModal();
  });
  modal.addEventListener('click', e => { if(e.target === modal) closeGalModal(); });
  document.addEventListener('keydown', e => {
    if(!document.getElementById('galModal').classList.contains('open')) return;
    if(e.key === 'Escape')      closeGalModal();
    if(e.key === 'ArrowLeft')   navGal(-1);
    if(e.key === 'ArrowRight')  navGal(1);
  });
})();

// ── 계좌 아코디언 ──
let _accountCache = null;
function toggleAccord(btn) {
  btn.classList.toggle('open');
  const body = btn.nextElementSibling;
  body.classList.toggle('open');
  if(body.classList.contains('open')) loadAccounts(btn);
}
function loadAccounts(btn) {
  const isGroom = btn.textContent.includes('신랑');
  const elId    = isGroom ? 'groomAccounts' : 'brideAccounts';
  const el      = document.getElementById(elId);
  if(!GAS_URL) {
    el.innerHTML = '<p style="font-family:\'Noto Sans KR\';font-size:13px;color:var(--muted);padding:12px 0;">계좌 정보를 준비 중입니다.</p>';
    return;
  }
  if(_accountCache) { renderAccRows(el, _accountCache[isGroom?'groom':'bride']); return; }
  fetch(GAS_URL + '?action=getAccounts')
    .then(r => r.json())
    .then(data => {
      _accountCache = data;
      renderAccRows(document.getElementById('groomAccounts'), data.groom);
      renderAccRows(document.getElementById('brideAccounts'), data.bride);
    })
    .catch(() => { el.textContent = '불러오기 실패. 잠시 후 다시 시도해 주세요.'; });
}
function renderAccRows(el, accounts) {
  if(!accounts || !accounts.length) { el.textContent = '등록된 계좌가 없습니다.'; return; }
  el.innerHTML = accounts.map(a => `
    <div class="acc-row">
      <div class="acc-info">
        <p class="acc-bank">${a.bank} · ${a.label}</p>
        <p class="acc-number">${a.number || '⚠ 계좌번호 미기재'}</p>
      </div>
      <div class="acc-btns">
        ${a.kakao ? `<button class="acc-btn btn-kakaopay" onclick="window.open('${a.kakao}','_blank')" ${!a.number?'disabled':''}>카카오페이</button>` : ''}
        <button class="acc-btn btn-copy" onclick="copyAccNum('${a.number||''}')" ${!a.number?'disabled':''}>복사</button>
      </div>
    </div>`).join('');
}
function copyAccNum(num) {
  if(!num) return;
  if(navigator.clipboard) {
    navigator.clipboard.writeText(num).then(() => toast('계좌번호가 복사되었습니다 📋'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = num;
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('계좌번호가 복사되었습니다 📋');
  }
}

// 계좌 기간 메시지 & prefetch
(function initRegistry() {
  const [y,m,d]  = WEDDING_DATE.split('-').map(Number);
  const wDate    = new Date(y, m-1, d);
  const d60      = new Date(wDate.getTime() - 60*86400000);
  const pre      = document.getElementById('regPreMsg');
  if(pre) pre.textContent = `${d60.getMonth()+1}월 ${d60.getDate()}일부터 확인 가능합니다`;
  if(GAS_URL) {
    fetch(GAS_URL + '?action=getAccounts')
      .then(r => r.json())
      .then(data => { _accountCache = data; })
      .catch(() => {});
  }
})();

// ── 업로드 기간 ──
function isUploadPeriod() {
  const nowKST   = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Seoul'}));
  const todayKST = new Date(nowKST.getFullYear(), nowKST.getMonth(), nowKST.getDate());
  const [y,m,d]  = WEDDING_DATE.split('-').map(Number);
  const wDate    = new Date(y, m-1, d);
  const diff     = Math.round((todayKST - wDate) / 86400000);
  return diff >= 0 && diff <= 7;
}

// ── 사진 공유 ──
let _uploadFiles = [];
function handleSimpleUpload() {
  if(!GAS_URL)           { toast('현재 업로드 기능을 준비 중입니다 🙏'); return; }
  if(!isUploadPeriod())  { toast('업로드 가능 기간이 아닙니다'); return; }
  document.getElementById('fileInput').click();
}
function handleDriveUpload() {
  if(!DRIVE_URL)         { toast('구글 드라이브 주소를 아직 등록하지 않았습니다'); return; }
  if(!isUploadPeriod())  { toast('업로드 가능 기간이 아닙니다'); return; }
  window.open(DRIVE_URL);
}
function handleFiles(files) {
  _uploadFiles = Array.from(files);
  if(!_uploadFiles.length) return;
  const grid = document.getElementById('ulThumbGrid');
  grid.innerHTML = '';
  _uploadFiles.forEach((f, i) => {
    const over = f.size > 4*1024*1024;
    const div  = document.createElement('div');
    div.className = 'ul-thumb';
    div.id = `uth-${i}`;
    if(f.type.startsWith('image/')) {
      const url = URL.createObjectURL(f);
      f._objURL = url;
      div.innerHTML = `<img src="${url}" alt="">`;
    } else {
      div.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:28px;">🎬</div>`;
    }
    if(over) {
      div.innerHTML += `<span class="ul-badge over">×</span>`;
      div.innerHTML += `<span style="position:absolute;bottom:4px;left:4px;background:rgba(239,68,68,0.85);color:#fff;font-size:9px;padding:2px 5px;border-radius:4px;">용량초과</span>`;
    }
    grid.appendChild(div);
  });
  document.getElementById('ulCounter').textContent = `총 ${_uploadFiles.length}개`;
  document.getElementById('ulFill').style.width    = '0%';
  document.getElementById('ulStartBtn').disabled   = false;
  document.getElementById('uploadOverlay').classList.add('open');
}
function closeUploadOverlay() {
  document.getElementById('uploadOverlay').classList.remove('open');
  _uploadFiles.forEach(f => { if(f._objURL) { URL.revokeObjectURL(f._objURL); } });
  _uploadFiles = [];
  document.getElementById('fileInput').value = '';
}
async function startUpload() {
  if(!_uploadFiles.length) return;
  document.getElementById('ulStartBtn').disabled = true;
  const valid = _uploadFiles.filter(f => f.size <= 4*1024*1024);
  let done = 0, fail = 0;
  for(let i = 0; i < _uploadFiles.length; i++) {
    const f  = _uploadFiles[i];
    const th = document.getElementById(`uth-${i}`);
    if(f.size > 4*1024*1024) continue;
    const badge = document.createElement('span');
    badge.className = 'ul-badge spin';
    badge.innerHTML = '<span class="spin-anim">↻</span>';
    th.appendChild(badge);
    try {
      const b64 = await fileToB64(f);
      const fd  = new FormData();
      fd.append('action',   'upload');
      fd.append('fileName', f.name);
      fd.append('mimeType', f.type);
      fd.append('fileData', b64);
      await fetch(GAS_URL, { method:'POST', mode:'no-cors', body: fd });
      badge.className = 'ul-badge ok';
      badge.textContent = '✓';
      done++;
    } catch(e) {
      badge.className = 'ul-badge fail';
      badge.textContent = '×';
      fail++;
    }
    const prog = Math.round(((done+fail) / valid.length) * 100);
    document.getElementById('ulFill').style.width  = prog + '%';
    document.getElementById('ulCounter').textContent = `${done+fail} / ${valid.length} 완료`;
  }
  const over = _uploadFiles.length - valid.length;
  let msg;
  if(done > 0 && over === 0 && fail === 0) msg = `${done}장을 전송했습니다 📸`;
  else if(done > 0 && over > 0)            msg = `${done}장 전송 완료 (용량초과 ${over}장 제외)`;
  else if(fail > 0 && done === 0)          msg = '전송 실패. 잠시 후 다시 시도해 주세요.';
  else                                     msg = `${done}장 완료, ${fail}장 실패`;
  setTimeout(() => { closeUploadOverlay(); toast(msg); }, 800);
}
function fileToB64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload  = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(new Error('read error'));
    r.readAsDataURL(file);
  });
}

// ── 공유 ──
function copyUrl() {
  const url = SITE_URL || location.href;
  if(navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => toast('청첩장 주소가 복사되었습니다 💌'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta); ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    toast('청첩장 주소가 복사되었습니다 💌');
  }
}
function shareKakao() {
  if(!KAKAO_KEY || typeof Kakao === 'undefined') { copyUrl(); return; }
  if(!Kakao.isInitialized()) Kakao.init(KAKAO_KEY);
  try {
    Kakao.Share.sendDefault({
      objectType: 'feed',
      content: {
        title: `${GROOM_NAME} ♥ ${BRIDE_NAME} 결혼식에 초대합니다`,
        description: `${WEDDING_DATE} · ${VENUE_NAME}`,
        imageUrl: OG_IMAGE,
        link: { mobileWebUrl: SITE_URL, webUrl: SITE_URL }
      }
    });
  } catch(e) { copyUrl(); }
}

// ── BGM ──
(function initBgm() {
  const audio   = new Audio();
  audio.src     = `./${BGM_FILE}`;
  audio.loop    = true;
  audio.preload = 'metadata';
  let playing   = false;
  let gestured  = false;
  audio.addEventListener('error', () => console.warn('BGM load failed'));

  function tryAutoPlay() {
    if(gestured) return;
    gestured = true;
    audio.play().then(() => { playing = true; updateBgmUI(); }).catch(() => {});
  }
  ['touchstart','click','scroll'].forEach(ev =>
    document.addEventListener(ev, tryAutoPlay, { once: true, passive: true })
  );
  document.addEventListener('visibilitychange', () => {
    if(document.hidden) audio.pause();
    else if(playing) audio.play().catch(() => {});
  });
  window._bgmAudio   = audio;
  window._bgmPlaying = () => playing;
  window._setBgmPlaying = v => { playing = v; };
})();

function toggleBgm() {
  const audio  = window._bgmAudio;
  const isPlay = !window._bgmPlaying();
  window._setBgmPlaying(isPlay);
  if(isPlay) audio.play().catch(() => {});
  else audio.pause();
  updateBgmUI();
}
function updateBgmUI() {
  const icon  = document.getElementById('bgmIcon');
  const label = document.getElementById('bgmLabel');
  if(window._bgmPlaying()) {
    icon.classList.add('bgm-spin');
    label.textContent = '음악 끄기';
  } else {
    icon.classList.remove('bgm-spin');
    label.textContent = '음악 켜기';
  }
}

// ── 맨위로 ──
window.addEventListener('scroll', () => {
  document.getElementById('topBtn').classList.toggle('visible', window.pageYOffset > 300);
}, { passive: true });
function scrollTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

// ── 연도 ──
document.getElementById('footerYear').textContent = new Date().getFullYear();
</script>

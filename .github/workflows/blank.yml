/* =============================================
   리셋 & 기본
   ============================================= */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; scroll-behavior: smooth; }
body {
  font-family: 'Noto Serif KR', serif;
  background: var(--cream);
  color: var(--ink);
  max-width: 430px;
  margin: 0 auto;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

/* 드래그·우클릭 방지 */
body { user-select: none; -webkit-user-select: none; }
input, textarea, select { user-select: auto; -webkit-user-select: auto; }

/* 공통 텍스트 줄바꿈 */
p, h1, h2, h3, h4, span, li {
  word-break: keep-all;
  overflow-wrap: break-word;
}

/* =============================================
   Fade-up (IntersectionObserver)
   ============================================= */
.fade-up {
  opacity: 0;
  transform: translateY(28px);
  transition: opacity 0.72s ease, transform 0.72s ease;
}
.fade-up.visible { opacity: 1; transform: translateY(0); }

/* =============================================
   섹션 공통
   ============================================= */
section { padding: 72px 24px; position: relative; }

.section-label {
  font-family: 'Cormorant Garamond', serif;
  font-size: 12px;
  font-weight: 400;
  letter-spacing: 0.28em;
  text-transform: uppercase;
  color: var(--primary);
  text-align: center;
  margin-bottom: 8px;
}
.section-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 22px;
  font-weight: 500;
  color: var(--ink);
  text-align: center;
  margin-bottom: 44px;
}

/* 오너먼트 */
.ornament {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  margin: 44px auto;
}
.ornament::before, .ornament::after {
  content: '';
  flex: 1;
  height: 1px;
  max-width: 88px;
  background: linear-gradient(to right, transparent, var(--accent-dk));
}
.ornament::after { background: linear-gradient(to left, transparent, var(--accent-dk)); }
.ornament span { color: var(--accent-dk); font-size: 13px; }

/* =============================================
   Toast
   ============================================= */
#toast {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 88px);
  left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: rgba(30, 42, 58, 0.93);
  color: #fff;
  padding: 11px 22px;
  border-radius: 28px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  white-space: nowrap;
  opacity: 0;
  transition: opacity 0.28s, transform 0.28s;
  z-index: 9999;
  pointer-events: none;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* =============================================
   1. Hero
   ============================================= */
#hero {
  position: relative;
  height: 100dvh;
  min-height: 600px;
  overflow: hidden;
  padding: 0;
  display: flex;
  align-items: flex-end;
}
.hero-media {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 120%;
  top: -10%;
  object-fit: cover;
  object-position: center;
  will-change: transform;
}
.hero-veil {
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    transparent 25%,
    rgba(30,42,58,0.28) 58%,
    rgba(30,42,58,0.88) 100%
  );
  z-index: 1;
}

/* 꽃잎 */
.petal {
  position: absolute;
  top: -40px;
  z-index: 2;
  pointer-events: none;
  background: var(--accent);
  border-radius: 50% 0 50% 0;
  opacity: 0.72;
  animation: petalFall linear infinite;
}
@keyframes petalFall {
  0%   { transform: translateY(0) rotate(0deg) translateX(0); opacity: 0.8; }
  50%  { transform: translateY(48vh) rotate(160deg) translateX(18px); opacity: 0.55; }
  100% { transform: translateY(108vh) rotate(340deg) translateX(-12px); opacity: 0; }
}

/* Hero 콘텐츠 */
.hero-content {
  position: relative;
  z-index: 3;
  width: 100%;
  padding: 0 28px calc(env(safe-area-inset-bottom, 0px) + 52px);
  color: var(--white);
}

.hero-lead {
  font-family: 'ChironGoRound', 'Noto Serif KR', serif;
  font-size: 14px;
  font-weight: 300;
  line-height: 2.1;
  color: rgba(253, 250, 255, 0.88);
  margin-bottom: 22px;
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 0.85s 0.2s ease, transform 0.85s 0.2s ease;
  word-break: keep-all;
  overflow-wrap: break-word;
}
.hero-lead.in { opacity: 1; transform: translateY(0); }

.hero-names {
  font-family: 'Cormorant Garamond', serif;
  font-size: 52px;
  font-weight: 400;
  letter-spacing: 0.04em;
  line-height: 1;
  margin-bottom: 26px;
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 0.85s 0.5s ease, transform 0.85s 0.5s ease;
  word-break: keep-all;
}
.hero-names.in { opacity: 1; transform: translateY(0); }

/* 날짜·장소 모서리 박스 */
.hero-box {
  display: inline-block;
  position: relative;
  padding: 14px 20px;
  margin-bottom: 16px;
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 0.85s 0.8s ease, transform 0.85s 0.8s ease;
}
.hero-box.in { opacity: 1; transform: translateY(0); }
.hero-box::before, .hero-box::after,
.hero-box > .corner-b::before, .hero-box > .corner-b::after {
  content: '';
  position: absolute;
  width: 12px;
  height: 12px;
  border-color: var(--accent);
  border-style: solid;
}
.hero-box::before       { top:0; left:0;  border-width: 1px 0 0 1px; }
.hero-box::after        { top:0; right:0; border-width: 1px 1px 0 0; }
.hero-box > .corner-b::before { bottom:0; left:0;  border-width: 0 0 1px 1px; }
.hero-box > .corner-b::after  { bottom:0; right:0; border-width: 0 1px 1px 0; }

.hero-date-kr {
  font-family: 'Noto Serif KR', serif;
  font-size: 13.5px;
  font-weight: 400;
  line-height: 1.85;
  word-break: keep-all;
  overflow-wrap: break-word;
}
.hero-date-en {
  font-family: 'Cormorant Garamond', serif;
  font-size: 12px;
  font-weight: 300;
  letter-spacing: 0.22em;
  color: var(--accent);
  margin-top: 5px;
}

.hero-venue {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12.5px;
  font-weight: 300;
  color: rgba(253, 250, 255, 0.75);
  line-height: 1.75;
  word-break: keep-all;
  overflow-wrap: break-word;
  opacity: 0;
  transform: translateY(18px);
  transition: opacity 0.85s 1.1s ease, transform 0.85s 1.1s ease;
}
.hero-venue.in { opacity: 1; transform: translateY(0); }


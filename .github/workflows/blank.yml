  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.trans-card-body {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 300;
  color: var(--ink);
  line-height: 2.0;
  word-break: keep-all;
  overflow-wrap: break-word;
}
.trans-card-body b { font-weight: 500; }

/* =============================================
   5. RSVP
   ============================================= */
#rsvp {
  background: var(--ink);
  color: var(--white);
}
#rsvp .section-label { color: var(--primary-lt); }
#rsvp .section-title { color: var(--white); }

.rsvp-desc {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 300;
  color: rgba(253,250,255,0.65);
  text-align: center;
  margin-bottom: 30px;
  line-height: 2.0;
}
.rsvp-open-btn {
  display: block;
  width: 100%;
  max-width: 280px;
  margin: 0 auto;
  padding: 15px;
  background: transparent;
  border: 1px solid var(--accent);
  border-radius: 40px;
  color: var(--accent);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  font-weight: 400;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s, color 0.2s;
}
.rsvp-open-btn:hover { background: var(--accent); color: var(--ink); }

/* 모달 */
.modal-bg {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.58);
  z-index: 5000;
  align-items: flex-end;
  justify-content: center;
}
.modal-bg.open { display: flex; }

.modal-sheet {
  position: relative;
  width: 100%;
  max-width: 430px;
  max-height: 92dvh;
  background: var(--cream);
  border-radius: 22px 22px 0 0;
  overflow-y: auto;
  padding: 28px 24px calc(env(safe-area-inset-bottom,0px) + 30px);
  -webkit-overflow-scrolling: touch;
}
.modal-handle {
  width: 36px; height: 4px;
  background: var(--line);
  border-radius: 2px;
  margin: 0 auto 26px;
}
.modal-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 18px;
  font-weight: 500;
  color: var(--ink);
  text-align: center;
  margin-bottom: 26px;
}
.modal-close-btn {
  position: absolute;
  top: 18px; right: 20px;
  background: none; border: none;
  font-size: 22px; color: var(--muted);
  cursor: pointer; padding: 4px;
}

.fg { margin-bottom: 20px; }
.fg-label {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 11.5px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.06em;
  display: block;
  margin-bottom: 9px;
}
.radio-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.radio-chip {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 11px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13.5px;
  font-weight: 300;
  color: var(--ink);
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
}
.radio-chip:has(input:checked) {
  border-color: var(--primary);
  background: var(--bg2);
}
.radio-chip input { display: none; }

.form-ctrl {
  width: 100%;
  padding: 12px 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--white);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  font-weight: 300;
  color: var(--ink);
  outline: none;
  -webkit-appearance: none;
  appearance: none;
  transition: border-color 0.2s;
}
.form-ctrl:focus { border-color: var(--primary); }

.bus-group { display: none; }
.bus-group.show { display: block; }

.submit-btn {
  width: 100%;
  padding: 16px;
  background: var(--ink);
  color: var(--white);
  border: none;
  border-radius: 40px;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 15px;
  font-weight: 400;
  cursor: pointer;
  white-space: nowrap;
  margin-top: 10px;
  transition: opacity 0.2s;
}
.submit-btn:active { opacity: 0.78; }

/* =============================================
   6. 갤러리
   ============================================= */
#gallery { padding: 72px 0; background: var(--cream); }
#gallery .section-label,
#gallery .section-title { padding: 0 24px; }

.gallery-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px;
}
.gal-item {
  aspect-ratio: 1;
  overflow: hidden;
  cursor: pointer;
  background: var(--bg2);
}
.gal-item img {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.3s;
}
.gal-item:hover img { transform: scale(1.06); }
.gal-placeholder {
  width: 100%; height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 10px;
  color: var(--muted);
  background: var(--bg2);
}

/* 갤러리 풀스크린 모달 */
#galModal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.96);
  z-index: 6000;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#galModal.open { display: flex; }
.gm-counter {
  position: absolute;
  top: calc(env(safe-area-inset-top,0px) + 18px);
  left: 50%;
  transform: translateX(-50%);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  color: rgba(255,255,255,0.68);
  white-space: nowrap;
}
.gm-img {
  max-width: 100%;
  max-height: 82dvh;
  object-fit: contain;
  display: block;
  border-radius: 4px;
}
.gm-close {
  position: absolute;
  top: calc(env(safe-area-inset-top,0px) + 14px);
  right: 20px;
  background: none; border: none;
  color: #fff; font-size: 26px;
  cursor: pointer; padding: 4px;
}
.gm-nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: rgba(255,255,255,0.1);
  border: none;
  color: #fff;
  font-size: 22px;
  width: 40px; height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}
.gm-nav.prev { left: 12px; }
.gm-nav.next { right: 12px; }

/* =============================================
   7. 마음 전하실 곳
   ============================================= */
#registry { background: var(--bg2); }

.reg-mask-msg {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  font-weight: 300;
  color: var(--muted);
  text-align: center;
  line-height: 2.0;
  padding: 16px 0;
}
.pre-wedding-mask .reg-content { display: none; }
.post-wedding .reg-content { display: none; }
.pre-wedding-mask .reg-pre-msg { display: block; }
.post-wedding .reg-post-msg { display: block; }
.reg-pre-msg, .reg-post-msg { display: none; }

.accord-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  background: var(--cream);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-family: 'Noto Serif KR', serif;
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
  cursor: pointer;
  margin-bottom: 8px;
  transition: background 0.2s;
}
.accord-btn:hover { background: var(--bg2); }
.accord-arrow {
  font-size: 11px;
  color: var(--muted);
  transition: transform 0.3s;
}
.accord-btn.open .accord-arrow { transform: rotate(180deg); }

.accord-body { display: none; padding: 10px 0 6px; }
.accord-body.open { display: block; }

.acc-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: var(--cream);
  border-radius: 8px;
  margin-bottom: 8px;
  gap: 10px;
}
.acc-info { flex: 1; min-width: 0; }
.acc-bank {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 11.5px;
  font-weight: 400;
  color: var(--muted);
  margin-bottom: 2px;
}
.acc-number {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.acc-btns { display: flex; gap: 6px; flex-shrink: 0; }
.acc-btn {
  padding: 7px 11px;
  border-radius: 6px;
  border: none;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.2s;
}
.acc-btn:disabled { opacity: 0.3; cursor: default; }
.btn-kakaopay { background: #FEE500; color: var(--ink); }
.btn-copy     { background: var(--ink); color: var(--white); }

.reg-loading {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  color: var(--muted);
  text-align: center;
  padding: 18px 0;
}

/* =============================================
   8. 사진 공유하기
   ============================================= */
#memory { background: var(--cream); }

.memory-desc {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 300;
  color: var(--muted);
  text-align: center;
  margin-bottom: 28px;
  line-height: 2.0;
}
.memory-btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 16px;
}
.mem-btn {
  padding: 18px 10px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--bg2);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 400;
  color: var(--ink);
  cursor: pointer;
  text-align: center;
  white-space: nowrap;
  transition: background 0.2s, border-color 0.2s, color 0.2s;
}
.mem-btn:hover { background: var(--primary); color: var(--white); border-color: var(--primary); }
.mem-btn-icon { font-size: 22px; display: block; margin-bottom: 6px; }
.memory-note {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 11px;
  font-weight: 300;
  color: var(--muted);
  text-align: center;
  line-height: 1.8;
}

/* 업로드 오버레이 */
#uploadOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(30,42,58,0.97);
  z-index: 7000;
  flex-direction: column;
  padding: 24px 20px calc(env(safe-area-inset-bottom,0px) + 24px);
  overflow-y: auto;
}
#uploadOverlay.open { display: flex; }
.ul-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.ul-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 16px;
  color: var(--white);
}
.ul-close-btn {
  background: none; border: none;
  color: var(--white); font-size: 22px;
  cursor: pointer; padding: 4px;
}
.ul-notice {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 11.5px;
  color: var(--accent);
  text-align: center;
  margin-bottom: 16px;
}
.ul-thumb-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.ul-thumb {
  aspect-ratio: 1;
  border-radius: 8px;
  overflow: hidden;
  position: relative;
  background: rgba(255,255,255,0.07);
}
.ul-thumb img { width:100%; height:100%; object-fit:cover; }
.ul-badge {
  position: absolute;
  top: 4px; right: 4px;
  width: 22px; height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
}
.ul-badge.over { background:#ef4444; color:#fff; }
.ul-badge.ok   { background:#22c55e; color:#fff; }
.ul-badge.fail { background:#ef4444; color:#fff; }
.ul-badge.spin { background:rgba(255,255,255,0.18); }
.spin-anim { display:inline-block; animation: spinA 0.8s linear infinite; }
@keyframes spinA { to { transform:rotate(360deg); } }

.ul-progress-bar {
  height: 3px;
  background: rgba(255,255,255,0.13);
  border-radius: 2px;
  margin-bottom: 10px;
  overflow: hidden;
}
.ul-progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  transition: width 0.3s;
}
.ul-counter {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  color: rgba(255,255,255,0.65);
  text-align: center;
  margin-bottom: 20px;
}
.ul-start-btn {
  padding: 16px;
  background: var(--accent);
  border: none;
  border-radius: 40px;
  color: var(--ink);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  width: 100%;
}

/* =============================================
   9. 푸터
   ============================================= */
#footer {
  background: var(--ink);
  color: var(--white);
  padding: 60px 24px calc(env(safe-area-inset-bottom,0px) + 60px);
  text-align: center;
}
.footer-msg {
  font-family: 'Noto Serif KR', serif;
  font-size: 15px;
  font-weight: 300;
  line-height: 2.6;
  color: rgba(253,250,255,0.72);
  margin-bottom: 36px;
  word-break: keep-all;
  overflow-wrap: break-word;
}
.share-btn-row {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 36px;
}
.share-btn {
  padding: 12px 24px;
  border-radius: 40px;
  border: 1px solid rgba(255,255,255,0.18);
  background: transparent;
  color: var(--white);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 400;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s;
}
.share-btn:hover { background: rgba(255,255,255,0.09); }
.share-btn.kakao-share {
  background: #FEE500;
  color: #1E2A3A;
  border-color: #FEE500;
}
.footer-credit {
  font-family: 'Cormorant Garamond', serif;
  font-size: 12px;
  color: rgba(253,250,255,0.3);
  letter-spacing: 0.1em;
}

/* =============================================
   플로팅 버튼
   ============================================= */
.float-wrap {
  position: fixed;
  bottom: calc(env(safe-area-inset-bottom,0px) + 26px);
  z-index: 4000;
  pointer-events: none;
}
.float-wrap.left  { left: 18px; }
.float-wrap.right { right: 18px; }
.float-btn {
  pointer-events: all;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 10px 14px;
  border-radius: 40px;
  border: none;
  background: var(--ink);
  color: var(--white);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 11px;
  font-weight: 400;
  cursor: pointer;
  box-shadow: 0 4px 18px rgba(30,42,58,0.22);
  white-space: nowrap;
  transition: opacity 0.3s;
}
.float-btn.hidden { opacity: 0; pointer-events: none; }
.bgm-icon { font-size: 14px; }
.bgm-spin { animation: spinA 2s linear infinite; display: inline-block; }

#topBtn { opacity: 0; pointer-events: none; transition: opacity 0.3s; }
#topBtn.visible { opacity: 1; pointer-events: all; }

/* =============================================
   인쇄 숨김
   ============================================= */
@media print {
  .float-wrap, .modal-bg, #uploadOverlay,
  #galModal, .map-overlay, #toast { display: none !important; }
}
</style>
</head>
<body>

<div id="toast"></div>

<!-- =======================================
     1. Hero
     ======================================= -->
<section id="hero">
  <img class="hero-media" id="heroImg" src="./hero.jpg" alt="원정빈 박채영 웨딩">
  <div class="hero-veil"></div>
  <div id="petalWrap"></div>

  <div class="hero-content">
    <p class="hero-lead" id="heroLead">
      서로의 처음을 기억하는 우리가,<br>
      이제 함께하는 미래를 약속합니다.<br>
      같은 곳을 바라보며 나아갈 저희의 시작을 함께해주세요.
    </p>

    <p class="hero-names" id="heroNames">
      <span id="groomSpan"></span> ♥ <span id="brideSpan"></span>
    </p>

    <div class="hero-box" id="heroBox">
      <div class="corner-b"></div>
      <p class="hero-date-kr" id="heroDateKr"></p>
      <p class="hero-date-en" id="heroDateEn"></p>
    </div>

    <p class="hero-venue" id="heroVenue"></p>
  </div>
</section>

<!-- =======================================
     2. 초대 말씀
     ======================================= -->
<section id="invitation">
  <p class="section-label fade-up">Invitation</p>
  <p class="section-title fade-up">초대 말씀</p>

  <div class="fade-up">
    <p class="invite-text">
      정직하고 올곧은 마음으로 서로를 아끼며<br>
      빈곳은 서로 채워주는 든든한 부부가 되겠습니다.<br>
      채워갈 앞날이 기대되는 저희의 첫걸음,<br>
      영원히 함께할 시작을 축복해 주시면 감사하겠습니다.
    </p>
  </div>

  <div class="ornament fade-up"><span>❧</span></div>

  <div class="family-block fade-up">
    <p class="family-row">
      박종호 · 김현숙의 <span class="name-em">장남 원정빈</span>
    </p>
    <p class="family-row">
      박종호 · 김현숙의 <span class="name-em">차녀 박채영</span>
    </p>
  </div>
</section>

<!-- =======================================
     3. 캘린더
     ======================================= -->
<section id="calendar">
  <p class="section-label fade-up">Calendar</p>
  <p class="section-title fade-up">예식 일정</p>
  <p class="dday-text fade-up" id="ddayText"></p>
  <div class="fade-up">
    <table class="cal-table">
      <thead>
        <tr>
          <th class="sun">일</th><th>월</th><th>화</th>
          <th>수</th><th>목</th><th>금</th><th class="sat">토</th>
        </tr>
      </thead>
      <tbody id="calBody"></tbody>
    </table>
  </div>
  <div class="fade-up" style="text-align:center; margin-top:6px;">
    <button class="cal-add-btn" onclick="addToCalendar()">📅 일정 추가하기</button>
  </div>
</section>

<!-- =======================================
     4. 오시는 길
     ======================================= -->
<section id="location">
  <p class="section-label fade-up">Location</p>
  <p class="section-title fade-up">오시는 길</p>

  <p class="venue-name-disp fade-up" id="venueNameDisp"></p>
  <p class="venue-addr-disp fade-up" id="venueAddrDisp"></p>

  <div class="map-wrap fade-up">
    <iframe id="mapFrame" src="about:blank" allowfullscreen loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"></iframe>
    <div class="map-overlay" id="mapOverlay" onclick="revealMap()">
      <span class="map-overlay-icon">🗺️</span>
      <span class="map-overlay-txt">터치하여 지도를 확인하세요</span>
    </div>
  </div>

  <div class="map-btn-grid fade-up">
    <button class="map-btn btn-kakao" onclick="openMapApp('kakao')">카카오맵</button>
    <button class="map-btn btn-naver" onclick="openMapApp('naver')">네이버지도</button>
    <button class="map-btn btn-tmap"  onclick="openMapApp('tmap')">티맵</button>
  </div>

  <!-- 지하철 -->
  <div class="trans-card fade-up">
    <p class="trans-card-title"><span>🚇</span> 지하철 이용시</p>
    <p class="trans-card-body">
      <b>6호선 고려대역 2번 출구</b><br>
      <!-- 교체 필요 : 도보 또는 버스 환승 안내 -->
      도보 약 5분 거리입니다
    </p>
  </div>

  <!-- 버스 -->
  <div class="trans-card fade-up">
    <p class="trans-card-title"><span>🚌</span> 버스 이용시</p>
    <p class="trans-card-body">
      <!-- 교체 필요 : 정류장명 -->
      <b>정류장명</b> 하차<br>
      <!-- 교체 필요 : 버스 번호 -->
      이용 노선: 000, 000
    </p>
  </div>

  <!-- 자가용 -->
  <div class="trans-card fade-up">
    <p class="trans-card-title"><span>🚗</span> 자가용 이용시</p>
    <p class="trans-card-body" id="carInfo">
      <!-- JS로 VENUE_NAME/VENUE_ADDR 자동 삽입 -->
    </p>
  </div>

  <!-- 전세버스 -->
  <!-- 전세버스가 없으면 이 trans-card 전체를 삭제하세요 -->
  <div class="trans-card fade-up">
    <p class="trans-card-title"><span>🚍</span> 전세버스 이용시</p>
    <p class="trans-card-body">
      <!-- 교체 필요 : 출발지 장소명 -->
      출발지: 장소명<br>
      <!-- 교체 필요 : 출발 시간 -->
      출발 시간: HH:MM<br>

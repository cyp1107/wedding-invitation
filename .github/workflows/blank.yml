  margin-bottom: 6px;
}
.venue-addr-disp {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 300;
  color: var(--muted);
  text-align: center;
  margin-bottom: 22px;
}

.map-wrap {
  position: relative;
  width: 100%;
  height: 320px;
  border-radius: 14px;
  overflow: hidden;
  margin-bottom: 14px;
  background: var(--bg2);
}
.map-wrap iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
.map-overlay {
  position: absolute;
  inset: 0;
  background: rgba(30,42,58,0.52);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
  transition: opacity 0.3s;
  z-index: 2;
}
.map-overlay-icon { font-size: 30px; }
.map-overlay-txt {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  color: #fff;
}

.map-btn-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 32px;
}
.map-btn {
  padding: 12px 4px;
  border-radius: 8px;
  border: none;
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.2s;
}
.map-btn:active { opacity: 0.78; }
.btn-kakao { background: #FEE500; color: var(--ink); }
.btn-naver { background: #03C75A; color: #fff; }
.btn-tmap  { background: var(--ink); color: var(--white); }

/* 교통편 카드 */
.trans-card {
  background: var(--bg2);
  border-radius: 12px;
  padding: 20px 20px;
  margin-bottom: 10px;
}
.trans-card-title {
  font-family: 'Noto Serif KR', serif;
  font-size: 14px;
  font-weight: 500;
  color: var(--primary);

<!--
  📁 GitHub 저장소 파일 구조
  ├── index.html          ← 이 파일
  ├── hero.jpg            ← Hero 사진 / video poster 겸용 (항상 필수)
  ├── hero.mp4            ← Hero 영상  (HERO_TYPE = 'video' 선택 시 필수)
  ├── bgm.mp3             ← BGM 파일   (BGM_FILE 상수와 이름 일치시킬 것)
  └── gallery/
      ├── 1.jpg
      ├── 2.jpg
      └── ...             (GALLERY_COUNT 개수만큼)

  🚀 배포 방법 (Vercel 전용)
  ① GitHub 저장소(Public)에 index.html + 에셋 파일 업로드
  ② vercel.com → "Add New Project" → GitHub 저장소 선택
  ③ 설정 변경 없이 "Deploy" 클릭 → 자동 배포 완료
  ④ 발급된 URL(예: xxx.vercel.app)을 SITE_URL 상수와
     og:url / og:image 메타 태그에 붙여넣고 재배포

  ⚠️  저장소는 반드시 Public으로 설정해야 합니다.
  ⚠️  GitHub Pages는 이 프로젝트에서 사용하지 않습니다.

  ✏️  1탄 완료 후 반드시 교체할 항목 (Ctrl+F → "교체 필요" 검색)
       1) SITE_URL 상수       → Vercel 배포 후 실제 URL
       2) og:url 메타 태그   → 동일 URL
       3) og:image 메타 태그 → 동일 URL + /hero.jpg
       4) KAKAO_KEY 상수     → (2탄에서 진행)
       5) GAS_URL 상수       → (2탄에서 진행)
       6) DRIVE_URL 상수     → (2탄에서 진행)
-->

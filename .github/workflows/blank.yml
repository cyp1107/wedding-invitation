  margin-bottom: 30px;
}

.cal-table {
  width: 100%;
  border-collapse: collapse;
}
.cal-table th {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 11px;
  font-weight: 400;
  color: var(--muted);
  text-align: center;
  padding: 8px 0;
}
.cal-table th.sun { color: var(--accent-dk); }
.cal-table th.sat { color: var(--muted); }

.cal-table td {
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 300;
  text-align: center;
  padding: 8px 0;
  color: var(--ink);
  vertical-align: middle;
}
.cal-table td.sun  { color: var(--accent-dk); }
.cal-table td.sat  { color: var(--muted); }
.cal-table td.grey { color: var(--line); }
.cal-table td.wedding-day { position: relative; }
.cal-table td.wedding-day span {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--ink);
  color: var(--white);
  font-weight: 500;
  position: relative;
}
.cal-table td.wedding-day span::after {
  content: '';
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
}

.cal-add-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin: 30px auto 0;
  padding: 12px 30px;
  background: transparent;
  border: 1px solid var(--primary);
  border-radius: 40px;
  color: var(--primary);
  font-family: 'Noto Sans KR', sans-serif;
  font-size: 13px;
  font-weight: 400;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.2s, color 0.2s;
}
.cal-add-btn:hover { background: var(--primary); color: var(--white); }

/* =============================================
   4. 오시는 길
   ============================================= */
#location { background: var(--cream); }

.venue-name-disp {
  font-family: 'Noto Serif KR', serif;
  font-size: 18px;
  font-weight: 500;
  color: var(--ink);
